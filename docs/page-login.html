<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Neo Admin</title>
    <script src="assets/js/neoadmin-theme.js?v=1.0.1"></script>
    <link rel="stylesheet" type="text/css" href="assets/css/neoadmin.css?v=1.0.1&amp;ui=footer-search-panel">
    <link rel="stylesheet" type="text/css" href="assets/css/neoadmin-icons.css?v=1.0.1">
  </head>
  <body>
    <section class="login-content">
      <div class="logo">
        <h1>Neo Admin</h1>
      </div>
      <div class="login-box">
        <form class="login-form" action="dashboard.html">
          <h3 class="login-head"><i class="bi bi-person me-2"></i>SIGN IN</h3>
          <div class="mb-3">
            <label class="form-label">USERNAME</label>
            <input class="form-control" type="text" placeholder="Email" autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">PASSWORD</label>
            <input class="form-control" type="password" placeholder="Password">
          </div>
          <div class="mb-3">
            <div class="utility">
              <div class="animated-checkbox">
                <label>
                  <input type="checkbox"><span class="label-text">Stay Signed in</span>
                </label>
              </div>
              <p class="semibold-text mb-2"><a href="#" data-neoadmin-login-flip>Forgot Password ?</a></p>
            </div>
          </div>
          <div class="mb-3 btn-container">
            <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right fs-5 me-2"></i>SIGN IN</button>
          </div>
        </form>
        <form class="forget-form" action="dashboard.html">
          <h3 class="login-head"><i class="bi bi-lock me-2"></i>Forgot Password ?</h3>
          <div class="mb-3">
            <label class="form-label">EMAIL</label>
            <input class="form-control" type="text" placeholder="Email">
          </div>
          <div class="mb-3 btn-container">
            <button class="btn btn-primary w-100"><i class="bi bi-unlock fs-5 me-2"></i>RESET</button>
          </div>
          <div class="mb-3 mt-3">
            <p class="semibold-text mb-0"><a href="#" data-neoadmin-login-flip><i class="bi bi-chevron-left me-2"></i>Back to Login</a></p>
          </div>
        </form>
      </div>
    </section>
    <script type="module" src="assets/js/neoadmin.js?v=1.0.1"></script>
  </body>
</html>
