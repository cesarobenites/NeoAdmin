<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="NeoAdmin is a modern, responsive admin dashboard template built with Bootstrap 5.3.">
    <title>Lockscreen - Neo Admin</title>
    <script src="assets/js/neoadmin-theme.js?v=1.0.1"></script>
    <link href="assets/css/neoadmin.css?v=1.0.1&amp;ui=footer-search-panel" rel="stylesheet">
    <link href="assets/css/neoadmin-icons.css?v=1.0.1" rel="stylesheet">
  </head>
  <body>
    <div id="neoadmin-page-loader">
      <div class="neoadmin-spinner">
        <div class="ring"></div>
        <div class="ring"></div>
      </div>
    </div>
    <section class="lockscreen-content">
      <div class="logo">
        <h1>Neo Admin</h1>
      </div>
      <div class="lock-box"><img class="rounded-circle user-image shadow" src="assets/images/avatar_128.jpg" width="80" height="80">
        <h4 class="text-center mt-3 mb-1">César Rolando</h4>
        <p class="text-center text-muted small">Account Locked</p>
        <form class="unlock-form mt-4" action="dashboard.html">
          <div class="mb-3">
            <label class="form-label fw-semibold">PASSWORD</label>
            <input class="form-control" type="password" name="password" value="" placeholder="Enter your password" autofocus="autofocus"/>
          </div>
          <div class="mt-4">
            <button class="btn btn-primary w-100 py-2" type="submit"><i class="bi bi-unlock fs-5 me-2"></i>UNLOCK</button>
          </div>
        </form>
        <p class="text-center mt-4"><a class="text-decoration-none small" href="page-login.html">Login as a different user.</a></p>
      </div>
    </section>
    <script type="module" src="assets/js/neoadmin.js?v=1.0.1"></script>
  </body>
</html>
